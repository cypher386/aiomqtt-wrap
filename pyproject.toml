[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "aiomqtt-wrap"
description = "A simple wrapper for aiomqtt asyncio with mqtt5 backend"
authors = [
    {name = "Jessica Porter", email = "jporter@freeside.come"}
]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.12"
version = "0.1"
dependencies = [
    "aiomqtt>=3.0.0a1",
    "dbus-next>=0.2.3",
    "desktop-notify==1.3.3",
    "mqtt5>=0.5.0",
    "pyserial==3.5",
    "pyserial-asyncio==0.6"
]

