[build-system]
requires = ["uv_build>=0.13.0"]
build-backend = "uv_build"

#requires = ["setuptools>=42", "wheel"]
#build-backend = "setuptools.build_meta"


[project]
name = "aiomqtt-wrap"
description = "A simple wrapper for aiomqtt asyncio with mqtt5 backend"
authors = [
    {name = "Jessica Porter", email = "jporter@freeside.come"}
]
keywords = ["mqtt", "aiomqtt", "monitoring", "data logging"]
classifiers = [
     "Development Status :: 3 - Alpha",
     "Intended Audience :: Homelab Users",
     "Topic :: Homelab :: Monitoring",
     "Programming Language :: Python :: 3.12",
     "Programming Language :: Python :: 3.13",
     "Programming Language :: Python :: 3.14"
     ]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.12"
version = "0.2"
dependencies = [
    "aiomqtt>=3.0.0a1",
    "dbus-next>=0.2.3",
    "desktop-notify==1.3.3",
    "mqtt5>=0.5.0",
    "pyserial==3.5",
    "pyserial-asyncio==0.6",
    "pyyaml>=6.0.3",
]
[project.urls]
Repository = "https://github.com/cypher386/aiomqtt_wrap.git"

[dependency-groups]
#dev = [
#    "russ>=0.0.2",
#]
[project.scripts]
aiomqtt-wrap = "aiomqtt_wrap:main"

[tool.ruff]
# Allow lines to be as long as Flake8 (79)
line-length = 79

[tool.ruff.lint]
#showSyntaxErrors = true

[tool.ruff.format]
#organizeImports = true
#lint = enable

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
authenticate = "always"

[tool.uv.build-backend]
#module-name = "FOO"
#module-root = ""

